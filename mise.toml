min_version = "2026.8.3"

[[hooks.enter]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko --path "$MISE_PROJECT_ROOT" hook enter bash)"
fi
'''

[[hooks.leave]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko hook leave bash)"
fi
'''

[tools]
bun = "latest"
biome = "latest"
node = "lts"
gitleaks = "latest"
pre-commit = "latest"
# Pinned to the same version apps/api declares, so `mise exec -- wrangler`
# and `bun run --cwd apps/api cf:deploy` can never drift onto different
# Workers runtimes. Provided here as well as in package.json so deploying
# does not depend on a global install that a fresh checkout would not have.
"npm:wrangler" = "4.123.0"

[tasks.default]
description = "Show available tasks"
run = "mise tasks ls"

[tasks.install]
description = "Install dependencies"
run = "bun install"

[tasks.dev]
description = "Run the API and web dev servers concurrently"
run = "bun run --cwd apps/api dev & bun run --cwd apps/web dev & wait"

[tasks.dev-api]
description = "Run the local API server (Bun) with a file SQLite database"
run = "bun run --cwd apps/api dev"

[tasks.dev-web]
description = "Run the SolidJS web dev server (vite)"
run = "bun run --cwd apps/web dev"

[tasks.build]
description = "Build the project"
run = "bun run build"

[tasks.build-web]
description = "Build the web mail client (vite build -> apps/web/dist)"
run = "bun run --cwd apps/web build"

[tasks.build-api-node]
description = "Build the API server as a Node-runnable bundle"
run = "bun run --cwd apps/api build:node"

[tasks.start]
description = "Run the local API server"
run = "bun run --cwd apps/api start"

[tasks.client-serve]
description = "Serve the browser mail client via the flying-mail CLI"
run = "bun run --cwd apps/cli start -- client serve"

[tasks.cf-dev]
description = "Run wrangler dev (Workers runtime with local D1/R2 simulators)"
run = "bun run --cwd apps/api cf:dev"

[tasks.cf-deploy]
description = "Build the web client, apply remote migrations, and deploy"
depends = ["build-web"]
run = [
  "bun run --cwd apps/api migrate:remote",
  "bun run --cwd apps/api cf:deploy",
]

[tasks.bootstrap-admin]
description = "Create the first admin on an empty deployment (run under kinko exec; needs FLYING_MAIL_BOOTSTRAP_TOKEN and FLYING_MAIL_ENDPOINT)"
usage = '''
arg "<email>"
arg "<name>"
'''
run = 'bun run --cwd apps/cli start -- admin bootstrap --email "$usage_email" --name "$usage_name" --secret-file "{{config_root}}/.private/bootstrap-admin-api-key"'

[tasks.test]
description = "Run tests with Vitest"
run = "bun run test"

[tasks.test-watch]
description = "Run tests in watch mode with Vitest"
run = "bun run test:watch"

[tasks.test-verbose]
description = "Run tests with verbose output"
run = "bun run test -- --reporter=verbose"

[tasks.test-ui]
description = "Run tests with the Vitest UI"
run = "bun run test:ui"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bun run typecheck"

[tasks.fmt]
description = "Format code with Biome"
run = "bun run format"

[tasks.fmt-check]
description = "Check code formatting"
run = "bun run format:check"

[tasks.lint]
description = "Run all lints"
run = "bun run lint:biome && mise run fmt-check && mise run typecheck"

[tasks.clean]
description = "Clean build artifacts"
run = "bun run clean"

[tasks.ci]
description = "Run all CI checks"
run = "mise run lint && mise run test && mise run build"

[tasks.install-git-hooks]
description = "Install mise tools and the repository pre-commit hook"
run = '''
mise install

hooks_path=$(git config --local --get core.hooksPath || true)
if [ "$hooks_path" = ".git/hooks" ]; then
  git config --local --unset-all core.hooksPath
  hooks_path=""
fi

if [ -z "$hooks_path" ]; then
  mise exec -- pre-commit install
else
  mise exec -- pre-commit validate-config .pre-commit-config.yaml
  echo "Using existing custom Git hooks path: $hooks_path"
fi
'''


# --- Cloudflare mail plumbing -------------------------------------------
#
# Everything flying-mail needs on the Cloudflare side, so setting up a new
# sending domain never means clicking through the dashboard. All of it runs
# through `wrangler email`, which uses the same OAuth session as `deploy`
# (`mise exec -- wrangler login` if you have none).
#
# Two independent Cloudflare products are involved, and flying-mail cares about
# them for different reasons:
#
#   Email Routing  -- receiving, and the `send_email` Worker binding. Free,
#                     but the binding will only deliver to addresses
#                     registered AND verified as destinations on the
#                     account. Fine for mailing your own operators, useless
#                     for mailing customers.
#   Email Sending  -- outbound to *any* recipient, no per-recipient
#                     registration. Workers Paid. This is what a real mail
#                     server wants; set FLYING_MAIL_EMAIL_SENDING_ACCOUNT_ID and
#                     FLYING_MAIL_EMAIL_SENDING_TOKEN and flying-mail prefers it.
#
# `mail-status` first, then `mail-setup-receiving` or `mail-setup-sending`.

[tasks.mail-status]
description = "Show Cloudflare Email Routing/Sending state and verified destinations"
run = '''
echo "== Email Routing: zones =="
wrangler email routing list || true
echo
echo "== Email Routing: destination addresses (the send_email binding can only reach verified ones) =="
wrangler email routing addresses list || true
echo
echo "== Email Sending: domains (arbitrary recipients, Workers Paid) =="
wrangler email sending list || echo "  (unavailable: needs Email Sending permission on the token, or the feature enabled)"
'''

[tasks.mail-routing-enable]
description = "Enable Email Routing on a zone (receiving + the send_email binding)"
usage = 'arg "<domain>"'
run = '''
wrangler email routing enable "$usage_domain"
echo
echo "Publish the records below, then re-run 'mise run mail-status'."
wrangler email routing dns get "$usage_domain"
'''

[tasks.mail-routing-dns]
description = "Show the DNS records Email Routing needs for a zone"
usage = 'arg "<domain>"'
run = 'wrangler email routing dns get "$usage_domain"'

[tasks.mail-dest-add]
description = "Register a destination address; Cloudflare mails it a verification link that a human must click"
usage = 'arg "<email>"'
run = '''
wrangler email routing addresses create "$usage_email"
echo
echo "A verification link has been sent to $usage_email."
echo "Until someone clicks it the send_email binding will refuse this recipient."
'''

[tasks.mail-dest-list]
description = "List destination addresses and whether each is verified"
run = 'wrangler email routing addresses list'

[tasks.mail-sending-enable]
description = "Enable Email Sending for a domain, so flying-mail can mail arbitrary recipients (Workers Paid)"
usage = 'arg "<domain>"'
run = '''
wrangler email sending enable "$usage_domain"
echo
echo "Publish the records below (SPF/DKIM/DMARC), then set the Worker secret:"
echo "  wrangler secret put FLYING_MAIL_EMAIL_SENDING_TOKEN"
echo "and FLYING_MAIL_EMAIL_SENDING_ACCOUNT_ID as a var, then redeploy."
wrangler email sending dns get "$usage_domain"
'''

[tasks.mail-sending-dns]
description = "Show the DNS records Email Sending needs for a domain"
usage = 'arg "<domain>"'
run = 'wrangler email sending dns get "$usage_domain"'

[tasks.mail-setup-receiving]
description = "Enable Email Routing on a zone and register one destination address"
usage = '''
arg "<domain>"
arg "<destination_email>"
'''
run = '''
mise run mail-routing-enable "$usage_domain"
mise run mail-dest-add "$usage_destination_email"
'''

[tasks.mail-login]
description = "Re-authenticate wrangler WITH the email scopes (opens a browser; needed before mail-sending-enable)"
run = '''
# `wrangler login` grants a fixed scope set that omits both email scopes, so
# every `wrangler email sending ...` call fails with Unauthorized [2036]
# until the session is re-minted with them. Re-listing the existing scopes is
# required: the flag replaces the set rather than adding to it.
wrangler login --scopes \
  account:read user:read \
  workers:write workers_kv:write workers_routes:write workers_scripts:write workers_tail:read \
  d1:write pages:write zone:read ssl_certs:write ai:write \
  email_routing:write email_sending:write
echo
wrangler whoami
'''
